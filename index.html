<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://www.gstatic.com https://cdnjs.cloudflare.com https://apis.google.com https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://cdnjs.cloudflare.com https://www.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E6B57'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='white'%3E$%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230E6B57'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='white'%3E$%3C/text%3E%3C/svg%3E">
<title>Presupuesto financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sticky month bar, one scrolling view, bottom tab bar, floating "+" for the quick-add sheet. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#16201B; --muted:#5E6B64; --line:#DCE2DD;
  --accent:#0E6B57; --accent-soft:#DDEEE8; --warn:#9A5B00; --warn-soft:#FBEFD9;
  --bad:#B42318; --bad-soft:#FBE3E0; --good:#1E7A3C;
  --c-fijos:#6B7A73; --c-tar:#C27C0E; --c-deu:#B42318; --c-cuo:#5B5BD6; --c-dia:#0E6B57; --c-aho:#2F7FB8;
  --f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1412; --surface:#171E1B; --ink:#E6ECE8; --muted:#97A49D; --line:#2A3430;
  --accent:#4FC2A4; --accent-soft:#16332B; --warn:#E3A84A; --warn-soft:#33270F;
  --bad:#F07A6E; --bad-soft:#3A1915; --good:#6FD08D;
  --c-fijos:#8FA199; --c-tar:#E3A84A; --c-deu:#F07A6E; --c-cuo:#9C9CF5; --c-dia:#4FC2A4; --c-aho:#6CB4E8; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
body.hide .money{filter:blur(7px)}
.muted{color:var(--muted)}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px}
.top .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;margin-right:auto}
.iconbtn{background:none;border:0;cursor:pointer;width:36px;height:36px;border-radius:9px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;cursor:pointer;padding:0;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile{display:flex;gap:14px;align-items:center}
.profile .avatar{width:64px;height:64px;font-size:24px;cursor:default}
.profile .nm{font-weight:800;font-size:18px}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.mnav{display:flex;align-items:center}
.mnav .lbl{min-width:112px;text-align:center;font-weight:700;text-transform:capitalize;font-size:14px}
.mnav .hoy{font-size:12px;width:auto;padding:0 8px;color:var(--accent);font-weight:700}
.status{max-width:820px;margin:2px auto 0;font-size:11.5px;color:var(--muted);min-height:15px}

main{max-width:820px;margin:0 auto;padding:12px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.card h2{font-size:15px;font-weight:700;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h2 .num{font-size:14px}
.hint{color:var(--muted);font-size:12.5px;margin-top:2px}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.hero .big{font-family:var(--f-num);font-weight:600;font-size:clamp(38px,11vw,56px);line-height:1.05;margin:6px 0 2px;letter-spacing:-.03em}
.hero .big.neg{color:var(--bad)}
.hero .sub{color:var(--muted);font-size:13.5px}
.hero .sub b{color:var(--ink);font-weight:600}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.meter{height:8px;border-radius:99px;background:var(--line);margin-top:14px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend>span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

.quick{display:flex;gap:8px;margin-top:12px}
.quick input{flex:1;min-width:0;font-size:16px;padding:13px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.quick button{flex:none}
.shortcuts{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.shortcuts::-webkit-scrollbar{display:none}
.sc{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.sc b{font-family:var(--f-num);font-weight:600;margin-left:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:18px;margin-top:2px}
.kpi .v.neg{color:var(--bad)}

.alerts{display:grid;gap:8px;margin-top:12px}
.alert{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.alert b{color:var(--warn)}
.alert.bad{background:var(--bad-soft)} .alert.bad b{color:var(--bad)}
.alert.ok{background:var(--accent-soft)} .alert.ok b{color:var(--accent)}

.rows{margin-top:6px}
.r{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.r:last-child{border-bottom:0}
.r .t{min-width:0}
.r .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .t .s{font-size:12px;color:var(--muted)}
.r.done .t div:first-child{text-decoration:line-through;color:var(--muted)}
.r input[type=checkbox]{width:19px;height:19px;margin:0;accent-color:var(--accent)}
.r.click{cursor:pointer}
.r.click:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}
.r .amt2{text-align:right}
.r .amt2 .s{font-size:11.5px;color:var(--muted);font-family:var(--f-ui)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.grp{display:flex;justify-content:space-between;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:14px;padding-bottom:4px;border-bottom:1px solid var(--line)}
details.sub>summary{list-style:none;cursor:pointer}
details.sub>summary::-webkit-details-marker{display:none}
details.sub .inner{padding:0 0 6px 29px}
details.sub .inner .r{font-size:13px;padding:7px 0}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.mini{width:auto;padding:3px 6px;font-size:12px;border-radius:7px;margin-left:2px;max-width:170px}
.tag.a{background:var(--accent-soft);color:var(--accent)}

.bar{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;font-size:13px;margin-top:9px}
.bar .tr{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar .tr i.over{background:var(--bad)}
.bar .v{font-size:12.5px;text-align:right}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:170px;margin-top:14px;position:relative}
.cols .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0;font-size:11px;color:var(--muted)}
.cols .stack{width:72%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.cols .stack i{display:block;width:100%}
.cols b{font-family:var(--f-num);font-weight:500;font-size:10px;color:var(--ink);white-space:nowrap}
.cols .ingline{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.6}

.tcard{border-radius:14px;padding:16px;margin-top:12px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));position:relative;overflow:hidden}
.tcard .nm{font-weight:800;font-size:17px}
.tcard .sm{font-size:12px;opacity:.85}
.tcard .tot{font-family:var(--f-num);font-weight:600;font-size:28px;margin-top:10px;letter-spacing:-.02em}
.tcard .row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;opacity:.95}
.tcard .row b{font-family:var(--f-num);font-weight:600}
.tcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tcard .acts button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filters>*{flex:1 1 140px;min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--surface);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:600}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 11px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--muted);font-size:13.5px;padding:12px 0 4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav.tabs button{background:none;border:0;cursor:pointer;padding:6px 1px;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected=true]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 394px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--surface);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}

dialog{border:0;border-radius:18px;padding:0;width:min(600px,calc(100vw - 20px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,13,.45)}
.dlg{padding:18px;display:grid;gap:12px;overflow:auto;max-height:calc(100dvh - 24px)}
.dlg h3{margin:0;font-size:17px}
.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.big-in{font-size:20px;padding:13px 14px;font-weight:600}
.parsed{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px;background:var(--bg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pchip b{font-family:var(--f-num)}
.pchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{font-size:13px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.cats button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;font-size:13px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.calc{font-size:13px;color:var(--muted);background:var(--bg);border-radius:9px;padding:9px 11px}
.calc b{color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.prev{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.prev .r{font-size:13px;padding:8px 0}
.sumbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sumbox div{background:var(--bg);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--muted)}
.sumbox b{display:block;color:var(--ink);font-family:var(--f-num);font-size:14px}

.screen{max-width:480px;margin:9vh auto 0;padding:26px 22px}
.screen h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
.screen p{color:var(--muted);margin:0 0 16px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pinpad button{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600;cursor:pointer}
.pindots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.sugg{display:grid;grid-template-columns:auto 1fr 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sugg input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}
.tl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;margin-top:14px}
.tl div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.tl i{display:block;width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.tl div:first-child i{background:var(--muted)}
.tl b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-size:10px;white-space:nowrap}
.tlb:hover i,.cols .c[data-proj-bar]:hover .stack{filter:brightness(1.12)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 10px 9px 14px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer;padding:4px 6px}
@media (prefers-color-scheme: dark){.toast button{color:#0E6B57}}
@media (max-width:440px){.bar{grid-template-columns:80px 1fr auto}.mnav .lbl{min-width:96px}.brand{display:none}.three{grid-template-columns:1fr 1fr}.sugg{grid-template-columns:auto 1fr 110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- login -->
<div id="loginView" hidden>
  <div class="card screen">
    <div class="lab">Presupuesto financiero</div>
    <h1>Tus cuentas claras, mes a mes</h1>
    <p>Entrá con tu cuenta de Google. Solo tu cuenta puede ver y cambiar tus datos.</p>
    <button class="btn" type="button" id="loginBtn" style="width:100%">Entrar con Google</button>
    <div class="hint" id="loginMsg" style="margin-top:10px"></div>
  </div>
</div>

<!-- pin -->
<div id="lockView" hidden>
  <div class="card screen" style="text-align:center">
    <div class="lab">Presupuesto financiero</div>
    <h1 id="lockTitle">Ingresá tu PIN</h1>
    <div class="pindots" id="pinDots"></div>
    <div class="hint" id="lockMsg" style="min-height:18px"></div>
    <div class="pinpad" id="pinPad"></div>
    <div class="btnrow" style="justify-content:center"><button class="btn sec sm" type="button" id="forgotPin">Olvidé el PIN</button></div>
  </div>
</div>

<!-- onboarding -->
<div id="onbView" hidden><div class="card screen" style="max-width:620px;margin-top:4vh" id="onb"></div></div>

<!-- app -->
<div id="appView" hidden>
  <header class="top">
    <div class="in">
      <div class="brand">Presupuesto financiero</div>
      <div class="mnav">
        <button type="button" class="iconbtn" id="mPrev" aria-label="Mes anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="lbl" id="mLbl"></div>
        <button type="button" class="iconbtn" id="mNext" aria-label="Mes siguiente"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" class="iconbtn hoy" id="mHoy">Hoy</button>
      </div>
      <button type="button" class="avatar" id="gearBtn" aria-label="Mi perfil"><span id="avTxt">?</span></button>
      <button type="button" class="iconbtn" id="eyeBtn" aria-label="Ocultar montos"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="status" id="status"></div>
  </header>
  <main>
    <section id="v-inicio"></section>
    <section id="v-gastos" hidden></section>
    <section id="v-fijos" hidden></section>
    <section id="v-tarjetas" hidden></section>
    <section id="v-ingresos" hidden></section>
    <section id="v-ahorro" hidden></section>
    <section id="v-plan" hidden></section>
    <section id="v-mas" hidden></section>
  </main>

function pagoDeCompra(fecha,c){

/* ---------- motor de cálculo ---------- */
function itemAmt(it,k){
  const i=diffM(it.desde,k);if(i<0)return 0;
  if(it.hasta&&k>it.hasta)return 0;
  if(it.tipo==="deuda"){const c=+it.monto||0,s=+it.saldo||0;if(!c)return 0;const rem=s-i*c;return Math.max(0,Math.min(c,rem))}
  if(it.n>0&&i>=it.n)return 0;
  return +it.monto||0;
}
function gastoPrimerMes(g){const c=cardOf(g.medio);if(g.pagoEn)return g.pagoEn;if(!c||cfg.ajustes.cuentaTarjeta==="compra")return mk(g.fecha);return pagoDeCompra(g.fecha,c)}
function gastoAmt(g,k){
  if(g.info)return 0;
  const c=cardOf(g.medio);
  if(!c)return mk(g.fecha)===k?g.monto:0;
  const n=Math.max(1,+g.cuotas||1),i=diffM(gastoPrimerMes(g),k);
  return (i>=0&&i<n)?g.monto/n:0;
}
function sueldoDe(k){return cfg.sueldoMes&&cfg.sueldoMes[k]!=null?+cfg.sueldoMes[k]:(+cfg.ingreso||0)}
function aguinaldoDe(k){const a=cfg.aguinaldo;if(!a||!a.on)return 0;const m=k.slice(5);if(m!=="06"&&m!=="12")return 0;if(a.mes&&a.mes[k]!=null)return +a.mes[k];return a.monto?+a.monto:Math.round((+cfg.ingreso||0)/2)}
let calcMemo={};
function carries(p){const a=cfg.arrastre||{};if(a[p]===false)return false;if(a[p])return true;return !!(cfg.arrastreAuto&&cfg.inicio&&p>=cfg.inicio)}
function objAporte(o,k){const i=diffM(o.desde,k);if(i<0||!(+o.aporte))return 0;const acum=(+o.inicial||0)+i*(+o.aporte);const falta=(+o.meta>0?+o.meta:Infinity)-acum;return Math.max(0,Math.min(+o.aporte,falta))}
function objAhorrado(o){let t=+o.inicial||0;const hoy=mk(todayISO());for(let k=o.desde,i=0;k<=hoy&&i<600;k=addM(k,1),i++){if(isPaid(k+"|obj:"+o.id))t+=objAporte(o,k)}return t}
function objFin(o){if(!(+o.aporte)||!(+o.meta))return null;const n=Math.ceil(Math.max(0,(+o.meta)-(+o.inicial||0))/(+o.aporte));return n?addM(o.desde,n-1):o.desde}
function calc(k,excl){const key=k+"|"+(excl||"");if(calcMemo[key])return calcMemo[key];const r=calcRaw(k,excl);calcMemo[key]=r;return r}
function calcRaw(k,excl){
  const r={k,ingresos:sueldoDe(k)+aguinaldoDe(k),sueldo:sueldoDe(k),aguinaldo:aguinaldoDe(k),extra:0,fijos:0,fijosTar:0,tarjetas:0,cuotas:0,deudas:0,diario:0,porTarjeta:{},lines:[],gastosMes:[],diferidos:0};
  const addCard=(c,line)=>{const t=(r.porTarjeta[c.id]=r.porTarjeta[c.id]||{lines:[],total:0});t.lines.push(line);t.total+=line.a;r.tarjetas+=line.a};
  cfg.items.forEach(it=>{
    const a=itemAmt(it,k);if(!a)return;
    if(it.tipo==="ingreso"){r.extra+=a;return}
    const c=cardOf(it.medio);
    if(c&&(it.tipo==="cuotas"||it.tipo==="fijo"||it.tipo==="resumen")){
      if(it.tipo==="fijo"){const cub=mesCubierto(c);if(cub&&k<=cub)return; r.fijosTar+=a}
      addCard(c,{kind:it.tipo,it,a,nombre:it.nombre});return}
    if(it.tipo==="fijo")r.fijos+=a;else if(it.tipo==="cuotas")r.cuotas+=a;else if(it.tipo==="deuda")r.deudas+=a;
    r.lines.push({it,a});
  });
  movs.forEach(g=>{
    if(g.info)return;
    const a=gastoAmt(g,k);if(!a)return;
    const c=cardOf(g.medio);
    if(c&&(mk(g.fecha)!==k||g.pagoEn))addCard(c,{kind:"gasto",g,a,nombre:g.nota||g.cat});
    else{r.diario+=a;r.gastosMes.push([g,a])}
  });
  r.diferidos=movs.filter(g=>!g.info&&cardOf(g.medio)&&mk(g.fecha)===k&&!g.pagoEn&&cfg.ajustes.cuentaTarjeta!=="compra").reduce((s,g)=>s+g.monto,0);
  r.ingresos+=r.extra;
  r.ahorroLines=(cfg.objetivos||[]).map(o=>({o,a:objAporte(o,k)})).filter(x=>x.a>0);
  r.ahorro=r.ahorroLines.reduce((s,x)=>s+x.a,0);
  r.carryIn=0;const p=addM(k,-1);
  if(carries(p)&&p!==excl)r.carryIn=calc(p,excl).queda;
  r.comp=r.fijos+r.tarjetas+r.cuotas+r.deudas;
  r.disp=r.ingresos+r.carryIn-r.comp-r.ahorro;
  r.queda=r.disp-r.diario;
  return r;
}
const isPaid=key=>!!cfg.pagados[key];
function deudaResumen(){
  const start=addM(mk(todayISO()),-6),end=addM(mk(todayISO()),48);const out={tarjetas:{},otros:[]};
  for(let k=start;k<=end;k=addM(k,1)){const r=calc(k);
    Object.entries(r.porTarjeta).forEach(([id,t])=>{if(isPaid(k+"|card:"+id))return;const lt=t.lines.filter(l=>l.kind!=="fijo").reduce((s,l)=>s+l.a,0);if(!lt)return;
      const o=(out.tarjetas[id]=out.tarjetas[id]||{total:0,next:null});o.total+=lt;if(!o.next)o.next=[k,t.total]})}
  cfg.items.filter(it=>it.tipo==="deuda"||(it.tipo==="cuotas"&&!cardOf(it.medio))).forEach(it=>{
    let total=it.tipo==="deuda"?(+it.saldo||0):0,pag=0,next=null;
    const meses=it.tipo==="deuda"?(+it.monto?Math.ceil((+it.saldo||0)/it.monto):0):(it.n||1);
    for(let i=0;i<Math.min(meses,600);i++){const k=addM(it.desde,i),a=itemAmt(it,k);if(!a)continue;if(it.tipo!=="deuda")total+=a;if(isPaid(k+"|"+it.id))pag+=a;else if(!next)next=[k,a]}
    out.otros.push({it,total,pag,rest:Math.max(0,total-pag),next,sinPlan:it.tipo==="deuda"&&!(+it.monto)&&total>0})});
  out.totTar=Object.values(out.tarjetas).reduce((s,t)=>s+t.total,0);
  out.totOtros=out.otros.reduce((s,o)=>s+o.rest,0);
  out.total=out.totTar+out.totOtros;return out;
}

/* ---------- carga rápida: entender "3500 café visa 3 cuotas" ---------- */
function guessCat(text){
  const t=norm(text);if(!t)return null;
  const first=t.split(/\s+/).find(w=>w.length>2);
  if(first&&cfg.aprendido&&cfg.aprendido[first]&&cfg.categorias.includes(cfg.aprendido[first]))return cfg.aprendido[first];
  for(const [cat,kws] of Object.entries(KEYWORDS)){if(!cfg.categorias.includes(cat))continue;if(kws.some(k=>t.includes(norm(k))))return cat}
  return null;
}
function parseQuick(text){
  const out={monto:0,cuotas:1,medio:null,fecha:null,nota:"",cat:null};
  let t=" "+String(text||"").trim()+" ";
  const mC=t.match(/\s(\d{1,2})\s*(cuotas|cuota|c)\s/i);if(mC){out.cuotas=Math.max(1,+mC[1]);t=t.replace(mC[0]," ")}
  if(/\sayer\s/i.test(t)){out.fecha=isoAdd(todayISO(),-1);t=t.replace(/\sayer\s/i," ")}
  else if(/\santeayer\s/i.test(t)){out.fecha=isoAdd(todayISO(),-2);t=t.replace(/\santeayer\s/i," ")}
  const mA=t.match(/\s\$?\s?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(k|mil)?(?=\s)/i);
  if(mA){let v=parseAmt(mA[1]);if(mA[2])v*=1000;out.monto=v;t=t.replace(mA[0]," ")}
  const words=norm(t);
  for(const c of cfg.tarjetas){const n=norm(c.nombre);const alias=[n,n.split(" ")[0]];if(/master/.test(n))alias.push("master","mc");if(/visa/.test(n))alias.push("visa");
    const hit=alias.find(a=>a&&new RegExp("\\s"+a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s").test(words));
    if(hit){out.medio="card:"+c.id;t=t.replace(new RegExp("\\s"+hit+"\\s","i")," ");break}}
  if(!out.medio){const m=[["efectivo","efectivo"],["efvo","efectivo"],["cash","efectivo"],["debito","debito"],["débito","debito"],["transferencia","transferencia"],["transf","transferencia"],["mp","mp"],["mercado pago","mp"],["mercadopago","mp"]];
    for(const [w,v] of m){const re=new RegExp("\\s"+w+"\\s","i");if(re.test(t)){out.medio=v;t=t.replace(re," ");break}}}
  out.nota=t.replace(/\s+/g," ").trim();
  out.nota=out.nota?out.nota.charAt(0).toUpperCase()+out.nota.slice(1):"";
  out.cat=guessCat(out.nota);
  return out;
}

function projectionTable(){

  if(!cfg.tarjetas.length)return "";
  const cell=v=>`<td class="num" style="text-align:right;padding:6px 8px;white-space:nowrap">${v?money(v):'<span class="muted">—</span>'}</td>`;
  let h=`<div class="card"><h2>Proyección por mes</h2><div class="hint">Lo que vas a pagar de cada tarjeta en los próximos meses: el resumen ya cerrado, las cuotas que siguen, los débitos automáticos y lo que vas cargando. Tocá una cuota para editarla.</div>
  <div style="overflow-x:auto;margin-top:10px"><table style="border-collapse:collapse;font-size:13px;min-width:720px;width:100%"><thead><tr><th style="text-align:left;padding:6px 8px;position:sticky;left:0;background:var(--surface)">Concepto</th>${ms.map(m=>`<th style="text-align:right;padding:6px 8px;color:var(--muted);font-weight:600;text-transform:capitalize">${mShort(m)} ${m.slice(2,4)}</th>`).join("")}</tr></thead><tbody>`;
  let any=false;

    const tots=rs.map(r=>(r.porTarjeta[c.id]||{total:0}).total);if(!tots.some(Boolean))return;any=true;

    // filas por concepto
    const rowsMap=new Map();
    rs.forEach((r,i)=>{const t=r.porTarjeta[c.id];if(!t)return;t.lines.forEach(l=>{const key=l.kind==="gasto"?"gastos":l.it.id;
      if(!rowsMap.has(key))rowsMap.set(key,{label:l.kind==="gasto"?"Compras que cargaste":l.kind==="resumen"?"Resumen cerrado (total a pagar)":l.kind==="fijo"?l.it.nombre+" (débito)":l.it.nombre,id:l.kind==="gasto"?null:l.it.id,sub:l.kind==="cuotas"?`${l.it.n} cuota${l.it.n>1?"s":""}${l.it.tna?" · TNA "+String(l.it.tna).replace(".",",")+"%":""}`:"",vals:Array(ms.length).fill(0)});
      rowsMap.get(key).vals[i]+=l.a})});
    [...rowsMap.values()].forEach(rw=>{h+=`<tr ${rw.id?`class="click" data-edit-item="${esc(rw.id)}" style="cursor:pointer"`:""}><td style="padding:6px 8px 6px 24px;position:sticky;left:0;background:var(--surface);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rw.label)}${rw.sub?`<div class="muted" style="font-size:11.5px">${esc(rw.sub)}</div>`:""}</td>${rw.vals.map(cell).join("")}</tr>`});
  });

  h+=`<tr style="border-top:2px solid var(--ink)"><td style="padding:8px;font-weight:800;position:sticky;left:0;background:var(--surface)">Total tarjetas</td>${tot.map(v=>`<td class="num" style="text-align:right;padding:8px;font-weight:800">${money(v)}</td>`).join("")}</tr></tbody></table></div></div>`;
  return any?h:`<div class="card"><h2>Proyección por mes</h2><div class="empty">Subí un resumen y acá vas a ver las cuotas de cada tarjeta mes a mes.</div></div>`;
}

function itemDesc(it){const m=medioLabel(it.medio);

  if(it.tipo==="deuda")return `Saldo ${fmt(it.saldo)} · ${+it.monto?"cuota "+fmt(it.monto)+" desde "+mShort(it.desde)+" "+it.desde.slice(0,4):"sin cuota cargada"}`;
  if(it.tipo==="ingreso")return `${fmt(it.monto)} · ${it.n===1?"una vez en":"desde"} ${mShort(it.desde)} ${it.desde.slice(0,4)}`;
  if(it.tipo==="resumen")return `Total del resumen · ${m} · ${mLabel(it.desde)}`;

function rowItem(it){return `<div class="r click" data-edit-item="${esc(it.id)}"><span class="dot" style="--c:var(${it.tipo==="fijo"?"--c-fijos":it.tipo==="deuda"?"--c-deu":it.tipo==="ingreso"?"--good":cardOf(it.medio)?"--c-tar":"--c-cuo"})"></span><div class="t"><div>${esc(it.nombre)}${it.tipo==="deuda"&&!(+it.monto)&&+it.saldo?'<span class="tag w">sin cuota</span>':""}</div><div class="s">${esc(itemDesc(it))}</div></div><span class="num">${money(it.tipo==="deuda"?it.saldo:it.monto)}</span></div>`}
function renderPlan(){
  const d=deudaResumen();
  let h=`<div class="card hero"><div class="lab">Lo que debés hoy</div><div class="big num">${money(d.total)}</div><div class="sub">Tarjetas <b class="num">${money(d.totTar)}</b> · préstamos y deudas <b class="num">${money(d.totOtros)}</b>. Baja a medida que tildás pagos.</div></div>`;
  h+=`<div class="card"><h2>Agregar</h2><div class="btnrow" style="margin-top:6px"><button class="btn" data-new="deuda">+ Préstamo o deuda</button><button class="btn sec" data-new="cuotas">+ Cuotas</button></div></div>`;
  const deu=cfg.items.filter(it=>it.tipo==="deuda"||(it.tipo==="cuotas"&&!cardOf(it.medio)));
  h+=`<div class="card"><h2>Préstamos y deudas<span class="num">${money(d.totOtros)}</span></h2>`;
  if(!deu.length)h+=`<div class="empty">Sin préstamos ni deudas cargadas.</div>`;
  d.otros.forEach(o=>{const pct=o.total?Math.min(100,o.pag/o.total*100):0;
    h+=`<div class="r click" data-edit-item="${esc(o.it.id)}"><span class="dot" style="--c:var(--c-deu)"></span><div class="t"><div>${esc(o.it.nombre)}${o.sinPlan?'<span class="tag w">sin cuota</span>':""}</div><div class="s">${o.total?"pagado "+fmt(o.pag)+" de "+fmt(o.total):"sin saldo"}${o.next?" · próximo "+fmt(o.next[1])+" en "+mName(o.next[0]):""}</div><div class="prog"><i style="width:${pct}%"></i></div></div><span class="num">${money(o.rest)}</span></div>`});
  h+=`</div>`;
  // evolución deuda, con detalle por tarjeta y por deuda
  const base=mk(todayISO());
  const det={};Object.entries(d.tarjetas).forEach(([id,t])=>{if(t.total>0)det["card:"+id]={nombre:(cardById(id)||{nombre:id}).nombre,tipo:"Tarjeta",v:t.total}});
  d.otros.forEach(o=>{if(o.rest>0)det[o.it.id]={nombre:o.it.nombre,tipo:o.it.tipo==="deuda"?"Deuda":"Cuotas",v:o.rest,sinPlan:o.sinPlan}});
  const pts=[{lab:"hoy",k:null,det:clone(det)}];
  for(let i=0;i<6;i++){const k=addM(base,i),r=calc(k);
    Object.entries(r.porTarjeta).forEach(([id,t])=>{if(isPaid(k+"|card:"+id))return;const x=det["card:"+id];if(x)x.v=Math.max(0,x.v-t.lines.filter(l=>l.kind!=="fijo").reduce((a,l)=>a+l.a,0))});
    r.lines.forEach(({it,a})=>{if((it.tipo==="deuda"||(it.tipo==="cuotas"&&!cardOf(it.medio)))&&!isPaid(k+"|"+it.id)&&det[it.id])det[it.id].v=Math.max(0,det[it.id].v-a)});
    pts.push({lab:"fin "+mShort(k),k,det:clone(det)})}
  pts.forEach(p=>p.total=Object.values(p.det).reduce((s,x)=>s+x.v,0));
  const mx=Math.max(1,...pts.map(p=>p.total));const sel=Math.min(ui.debtSel||0,pts.length-1),P=pts[sel];
  h+=`<div class="card"><h2>Cómo baja tu deuda</h2><div class="hint">Si pagás lo agendado. Tocá una barra para ver a qué corresponde.</div><div class="tl">${pts.map((p,i)=>`<div class="tlb" data-debt-bar="${i}" role="button" tabindex="0" aria-pressed="${i===sel}" aria-label="${esc(p.lab)}: ${fmt(p.total)}" style="cursor:pointer"><b class="money">${fmtM(p.total)}</b><i style="height:${p.total/mx*100}%;${i===sel?"outline:2px solid var(--ink);outline-offset:2px;":""}${i?"":"background:var(--muted)"}"></i><span style="${i===sel?"color:var(--ink);font-weight:700":""}">${p.lab}</span></div>`).join("")}</div>
    <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>${P.k?"A fin de "+mLabel(P.k):"Hoy"} debés</b><span class="num" style="font-weight:700">${money(P.total)}</span></div>
    ${P.k?`<div class="hint">Durante ${mName(P.k)} pagás ${fmt((pts[sel-1]||P).total-P.total)} de deudas.</div>`:""}
    <div class="rows">${Object.values(P.det).filter(x=>x.v>0.5).sort((a,b)=>b.v-a.v).map(x=>`<div class="r"><span class="dot" style="--c:var(${x.tipo==="Tarjeta"?"--c-tar":"--c-deu"})"></span><div class="t"><div>${esc(x.nombre)}${x.sinPlan?'<span class="tag w">sin cuota</span>':""}</div><div class="s">${x.tipo}${P.total?" · "+Math.round(x.v/P.total*100)+"% del total":""}</div></div><span class="num">${money(x.v)}</span></div>`).join("")||`<div class="empty">¡Sin deudas!</div>`}</div></div></div>`;
  $("#v-plan").innerHTML=h;
}

async function getPdfLib(){await loadScript(LIBS.pdf);const lib=window.pdfjsLib;

  return lib}
async function pdfLines(file){
  const lib=await getPdfLib();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
  for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p);const tc=await page.getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({x:i.transform[4],y:i.transform[5],w:i.width||i.str.length*4,h:i.height||Math.abs(i.transform[3])||8,s:i.str}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);const lines=[];
    its.forEach(it=>{const L=lines.find(l=>Math.abs(l.y-it.y)<=Math.max(2.5,Math.min(it.h,l.h)*0.45));if(L)L.items.push(it);else lines.push({y:it.y,h:it.h,items:[it]})});
    lines.sort((a,b)=>b.y-a.y).forEach(l=>{l.items.sort((a,b)=>a.x-b.x);const m=[];
      l.items.forEach(it=>{const last=m[m.length-1];if(last&&it.x-(last.x+last.w)<1.5){last.s+=it.s;last.w=it.x+it.w-last.x}else m.push({x:it.x,w:it.w,s:it.s})});
      const items=m.map(i=>({x:i.x,r:i.x+i.w,s:i.s.replace(/[\u0000-\u001f]/g,"").trim()})).filter(i=>i.s);
      out.push({page:p,items,text:items.map(i=>i.s).join("  ")})})}
  return out;
}
const RE_AMT=/^-?\$?\s?\d{1,3}(?:\.\d{3})*,\d{2}-?$/;
function dateFrom(s){let m=s.match(/^(\d{1,2})[-\/ ]([A-Za-zé]{3})[a-z]*\.?[-\/ ](\d{2,4})$/);if(m&&MABBR[norm(m[2]).slice(0,3)]){const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+pad(MABBR[norm(m[2]).slice(0,3)])+"-"+pad(m[1])}
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+pad(m[2])+"-"+pad(m[1])}return null}
async function parsePdfFile(file){
  const lines=await pdfLines(file);const all=lines.map(l=>l.text).join("\n");
  if(all.replace(/\s/g,"").length<50)throw new Error("El PDF no tiene texto (parece una foto escaneada). Probá descargarlo de nuevo desde el home banking.");
  const R={kind:"pdf",name:file.name,marca:null,bancoNombre:"",cuenta:null,cierre:null,vence:null,saldo:0,usd:0,minimo:0,proxCierre:null,proxVence:null,tc:0,tna:0,rows:[],banco:[],holders:[]};
  const mM=all.match(/\b(Visa|Mastercard|Master Card|American Express|Amex|Cabal|Naranja)\b[^\n]{0,30}?cuenta\s+(\d{4,})/i)||all.match(/\b(Visa|Mastercard|American Express|Cabal|Naranja)\b/i);
  if(mM){R.marca=titleCase(mM[1].replace(/master card/i,"Mastercard"));if(mM[2])R.cuenta=mM[2].slice(-4)}
  const bM=all.match(/\b(BBVA|Galicia|Santander|Macro|Naci[oó]n|Provincia|ICBC|HSBC|Credicoop|Supervielle|Patagonia|Ciudad|Brubank|Comafi|Hipotecario|Itaú|Itau|Columbia|Bancor|Banco del Sol|Naranja X)\b/i);if(bM)R.bancoNombre=titleCase(bM[1]).replace(/^Bbva$/,"BBVA").replace(/^Icbc$/,"ICBC").replace(/^Hsbc$/,"HSBC");
  const tcM=all.match(/TC\s?(\d{3,5}(?:,\d+)?)/);if(tcM)R.tc=parseAmt(tcM[1]);
  const tnaM=all.match(/TNA\s?\$?\s+(\d{1,3},\d{1,3})\s?%/);if(tnaM)R.tna=parseAmt(tnaM[1]);
  let pesosX=null,usdX=null,section="",holder="";
  for(let i=0;i<lines.length;i++){const L=lines[i],T=L.text,U=norm(T);
    // encabezado de resumen
    if(/cierre actual/.test(U)&&/vencimiento actual/.test(U)){const nx=lines.slice(i+1,i+3).find(l=>l.items.some(x=>dateFrom(x.s)));if(nx){const ds=nx.items.map(x=>dateFrom(x.s)).filter(Boolean);const as=nx.items.filter(x=>RE_AMT.test(x.s)).map(x=>parseAmt(x.s));
        if(ds[0])R.cierre=ds[0];if(ds[1])R.vence=ds[1];if(as.length>=1)R.saldo=as[0];if(as.length>=2)R.usd=as[1];if(as.length>=3)R.minimo=as[2]}}
    if(/proximo cierre/.test(U)&&/proximo vencimiento/.test(U)){const nx=lines.slice(i+1,i+4).find(l=>l.items.filter(x=>dateFrom(x.s)).length>=4);if(nx){const ds=nx.items.map(x=>dateFrom(x.s)).filter(Boolean);R.proxCierre=ds[2];R.proxVence=ds[3]}}
    if(!R.banco.length&&L.items.filter(x=>/^[A-ZÁÉ]+\/\d{2}$/.test(x.s)).length>=3){const hdr=L.items.filter(x=>/^[A-ZÁÉ]+\/\d{2}$/.test(x.s));
      const nxt=lines.slice(i+1,i+5);if(nxt.some(l=>/total de cuotas a vencer/.test(norm(l.text)))){
        const amtItems=nxt.flatMap(l=>l.items).filter(x=>/\d{1,3}(?:\.\d{3})*,\d{2}/.test(x.s));
        R.banco=hdr.map(hd=>{const m=hd.s.match(/([A-ZÁÉ]+)\/(\d{2})/);const mm=MABBR[norm(m[1]).slice(0,3)];const it=amtItems.find(a=>Math.abs(a.r-hd.r)<12);
          return [("20"+m[2])+"-"+pad(mm),it?parseAmt((it.s.match(/\d{1,3}(?:\.\d{3})*,\d{2}/)||["0"])[0]):0]})}}

    if(/^sus pagos y ajustes/.test(U)){section="pagos";continue}
    if(/^consumos\s+/.test(U)&&!/total/.test(U)){section="consumos";holder=titleCase(T.replace(/^consumos\s+/i,"").trim());if(!R.holders.includes(holder))R.holders.push(holder);continue}
    if(/^impuestos, cargos e intereses/.test(U)){section="cargos";holder="";continue}
    // líneas de movimiento: empiezan con fecha
    const f=dateFrom(L.items[0]&&L.items[0].s||"");if(!f||!section||section==="pagos")continue;
    const amts=L.items.filter(x=>RE_AMT.test(x.s));if(!amts.length)continue;
    let pesos=null,usd=null;const used=new Set();

async function parseSheetFile(file){

    if(/cuotas pendientes/.test(U)&&/plan cuotas/.test(U)){const R={kind:"pend",name:file.name,rows:[]};let buf=[];
      rows.forEach(r=>{const c0=String(r[0]||"");const tm=c0.match(/total tarjeta nro\s*\**\s*(\d{4})/i);if(tm){buf.forEach(x=>x.digits=tm[1]);R.rows.push(...buf);buf=[];return}
        const f=dateFrom(String(r[1]||"").trim());if(!f)return;const plan=parseInt(r[3])||0,pend=parseInt(r[4])||0;if(!pend)return;
        buf.push({fecha:f,desc:String(r[2]||"").trim(),plan,pend,prox:parseAmt(r[5]),rest:parseAmt(r[6]),planV:!String(r[2]||"").trim()})});

    if(hi>=0){const H=rows[hi].map(c=>norm(c));const ci={f:H.findIndex(h=>h.includes("fecha")),d:H.findIndex(h=>/movimiento|descrip|detalle|concepto|establec/.test(h)),c:H.findIndex(h=>h.startsWith("cuota")),m:H.findIndex(h=>/monto|importe/.test(h))};
      const R={kind:"movs",name:file.name,rows:[]};
      rows.slice(hi+1).forEach(r=>{const f=dateFrom(String(r[ci.f]||"").trim().split(" ")[0]);if(!f)return;const monto=parseAmt(r[ci.m]);if(!(monto>0))return;
        const desc=String(r[ci.d]||"").trim();if(/su pago|pago en pesos/i.test(desc))return;const cm=String(ci.c>=0?r[ci.c]:"").match(/(\d{1,2})\/(\d{1,2})/);
        const row={fecha:f,desc,monto,cur:cm?+cm[1]:0,tot:cm?+cm[2]:0};const tn=desc.match(/TNA\s*([\d,]+)/i);if(tn){row.tna=parseAmt(tn[1])}if(/plan v|financ/i.test(desc))row.planV=true;R.rows.push(row)});
      out.push(R);return}
    out.push({kind:"error",name:file.name+(wb.SheetNames.length>1?" ("+sn+")":""),msg:"No reconocí las columnas de esta planilla"})});

/* ---------- datos aptos para Firebase ---------- */
// Firebase no acepta: valores undefined, listas dentro de listas, NaN/Infinity. Limpiamos todo antes de guardar.
function fsSafe(v,inArray){
  if(v===undefined)return null;
  if(typeof v==="number")return isFinite(v)?v:0;
  if(Array.isArray(v)){const a=v.map(x=>fsSafe(x,true));return inArray?Object.assign({},a):a}
  if(v&&typeof v==="object"){const o={};Object.keys(v).forEach(k=>{if(v[k]===undefined||k==="")return;o[k.replace(/^__|__$/g,"_")]=fsSafe(v[k],false)});return o}
  return v;
}
function errTxt(e){const c=(e&&e.code)||"";if(/permission-denied/.test(c))return"Firebase no dio permiso. Revisá que hayas publicado las reglas nuevas y que entraste con tu cuenta.";
  if(/unavailable|network/.test(c))return"Sin conexión a internet. Se va a guardar cuando vuelva la conexión.";
  if(/invalid-argument/.test(c))return"Firebase rechazó un dato ("+((e&&e.message)||"").slice(0,90)+").";
  if(/resource-exhausted/.test(c))return"Se llegó al límite gratuito de Firebase por hoy.";
  return (e&&e.message)?e.message.slice(0,120):"Error desconocido";}

let saveT=null,chain=Promise.resolve();
function saveCfg(now){calcMemo={};clearTimeout(saveT);setStatus("Guardando…");const run=()=>{const body=fsSafe(clone(cfg));chain=chain.then(()=>store.saveCfg(body)).then(()=>setStatus(store.label)).catch(e=>{setStatus("No se pudo guardar: "+errTxt(e));toast("No se pudo guardar: "+errTxt(e))})};if(now)run();else saveT=setTimeout(run,450)}
function setStatus(t){$("#status").textContent=t||""}
function cleanGasto(g){const o={fecha:/^\d{4}-\d{2}-\d{2}$/.test(g.fecha||"")?g.fecha:todayISO(),monto:Math.max(0.01,Math.round((+g.monto||0)*100)/100),cat:String(g.cat||"Otros").slice(0,60),medio:String(g.medio||"").slice(0,60),cuotas:+g.cuotas||1,nota:String(g.nota||"").slice(0,200),creado:+g.creado||Date.now()};
  if(g.info)o.info=true;if(g.pagoEn)o.pagoEn=g.pagoEn;if(g.importKey)o.importKey=String(g.importKey).slice(0,40);return o}
// Revisa los datos con las mismas restricciones que Firebase y las reglas (sirve para probar sin conexión)
function fsCheck(v,path,inArr){
  if(v===undefined)throw {code:"invalid-argument",message:"valor vacío en "+path};
  if(typeof v==="number"&&!isFinite(v))throw {code:"invalid-argument",message:"número inválido en "+path};
  if(Array.isArray(v)){if(inArr)throw {code:"invalid-argument",message:"lista dentro de lista en "+path};v.forEach((x,i)=>fsCheck(x,path+"["+i+"]",true));return}
  if(v&&typeof v==="object")Object.keys(v).forEach(k=>fsCheck(v[k],path+"."+k,false));
}
function ruleMov(o){const ok=["fecha","monto","cat","medio","cuotas","nota","creado","info","pagoEn","importKey"];
  if(Object.keys(o).some(k=>!ok.includes(k))||!(o.monto>0)||!/^\d{4}-\d{2}-\d{2}$/.test(o.fecha)||String(o.cat).length>60||String(o.medio).length>60||String(o.nota||"").length>200||!(o.cuotas>=1&&o.cuotas<=60))throw {code:"permission-denied",message:"regla de gastos"}}

  const K="pf_v4";let data={cfg:null,movs:[]};try{data=JSON.parse(localStorage.getItem(K))||data}catch(e){}
  if(data.cfg&&data.cfg.v===4)cfg=Object.assign(emptyCfg(),data.cfg);movs=data.movs||[];
  const w=()=>{try{localStorage.setItem(K,JSON.stringify({cfg,movs}))}catch(e){}};
  return{label:"Guardado en este navegador.",hasOld:false,
    saveCfg:async body=>{if(body){fsCheck(body,"config");if(body.v!==4)throw {code:"permission-denied"}}w()},
    saveGasto:async g=>{const o=fsSafe(cleanGasto(g));fsCheck(o,"gasto");ruleMov(o);let id=g.id;if(!id){id="g"+uid_();movs.push(Object.assign({id},o))}else{const i=movs.findIndex(x=>x.id===id);if(i>=0)movs[i]=Object.assign({id},o);else movs.push(Object.assign({id},o))}w();render();return id},
    saveMany:async arr=>{arr.forEach(g=>{const o=fsSafe(cleanGasto(g));fsCheck(o,"gasto");ruleMov(o)});arr.forEach(g=>{const o=fsSafe(cleanGasto(g));if(g.id){const i=movs.findIndex(x=>x.id===g.id);if(i>=0)movs[i]=Object.assign({id:g.id},o)}else movs.push(Object.assign({id:"g"+uid_()},o))});w();render()},
    delGasto:async id=>{movs=movs.filter(g=>g.id!==id);w();render()},
    wipeOld:async()=>{},wipeAll:async()=>{cfg=emptyCfg();movs=[];w();startFlow()}};
}
function showMain(){paintAvatar();if(cfg.onboarded&&seedPrevio()){saveCfg(true);setTimeout(()=>toast("Cargué tus gastos fijos y deudas. Revisalos en Fijos y Deudas."),400)}$("#loginView").hidden=true;$("#lockView").hidden=true;$("#onbView").hidden=true;$("#appView").hidden=false;ready=true;go(view)}
function startFlow(){
  ready=false;
  if(cfg.pin&&!startFlow.unlocked){startFlow.unlocked=true;showLock();return}
  if(!cfg.onboarded){$("#appView").hidden=true;$("#onbView").hidden=false;onb={step:0,borrarViejo:true,ingreso:"",dia:1};renderOnb();return}
  showMain();
}
// Gmail ignora puntos, mayúsculas y lo que va después de "+": a.b+x@gmail.com es la misma cuenta que ab@gmail.com
function normEmail(e){e=String(e||"").trim().toLowerCase();let[u,d]=e.split("@");if(!d)return e;if(d==="googlemail.com")d="gmail.com";if(d==="gmail.com")u=u.split("+")[0].replace(/\./g,"");return u+"@"+d}
function init(){
  mes=mk(todayISO());try{ui.hide=localStorage.getItem("pf_hide")==="1"}catch(_){}
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){store=localStore();setStatus("Sin conexión a Firebase: se guarda solo en este navegador.");startFlow();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),fdb=firebase.firestore();
  fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const provider=()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});return p};
  $("#loginBtn").onclick=async()=>{$("#loginMsg").textContent="";try{await auth.signInWithPopup(provider())}catch(e){if(e&&/popup-blocked|operation-not-supported|cancelled-popup/.test(e.code||""))auth.signInWithRedirect(provider());else if(e.code!=="auth/popup-closed-by-user")$("#loginMsg").textContent="No se pudo entrar: "+(e.code==="auth/unauthorized-domain"?"falta autorizar este dominio en Firebase.":"probá de nuevo.")}};
  let unsub=[];
  auth.onAuthStateChanged(async user=>{
    unsub.forEach(u=>u());unsub=[];ready=false;startFlow.unlocked=false;
    if(!user){$("#appView").hidden=true;$("#lockView").hidden=true;$("#onbView").hidden=true;$("#loginView").hidden=false;return}
    if(CUENTAS_PERMITIDAS.length&&!CUENTAS_PERMITIDAS.map(normEmail).includes(normEmail(user.email))){$("#loginMsg").textContent="Esta cuenta ("+user.email+") no tiene acceso. Pasale este mail exacto a quien administra la app.";await auth.signOut();return}
    $("#loginView").hidden=true;setStatus("Conectando…");
    const base=fdb.collection("users").doc(user.uid),cfgRef=base.collection("app").doc("config"),mCol=base.collection("movs");
    const oldCfg=base.collection("config").doc("main"),oldG=base.collection("gastos");
    let hasOld=false;try{const s=await oldCfg.get();const g=await oldG.limit(1).get();hasOld=s.exists||!g.empty}catch(_){}
    const delCol=async col=>{for(;;){const s=await col.limit(300).get();if(s.empty)break;const b=fdb.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit()}};
    store={label:"Guardado en tu cuenta.",email:user.email,user:{name:user.displayName||"",email:user.email||"",photo:user.photoURL||""},hasOld,logout:()=>auth.signOut(),
      reauth:()=>user.reauthenticateWithPopup(provider()),
      saveCfg:body=>cfgRef.set(fsSafe(body)),
      saveGasto:async g=>{const o=fsSafe(cleanGasto(g));if(g.id){await mCol.doc(g.id).set(o);return g.id}const ref=mCol.doc();await ref.set(o);return ref.id},
      saveMany:async arr=>{for(let i=0;i<arr.length;i+=400){const b=fdb.batch();arr.slice(i,i+400).forEach(g=>{const ref=g.id?mCol.doc(g.id):mCol.doc();b.set(ref,fsSafe(cleanGasto(g)))});await b.commit()}},
      delGasto:async id=>{await mCol.doc(id).delete()},
      wipeOld:async()=>{await oldCfg.delete().catch(()=>{});await delCol(oldG);store.hasOld=false},
      wipeAll:async()=>{await delCol(mCol);await cfgRef.delete();await oldCfg.delete().catch(()=>{});await delCol(oldG);cfg=emptyCfg();movs=[];startFlow.unlocked=true;startFlow()}};
    let first=true;
    unsub.push(cfgRef.onSnapshot(s=>{
      const wasOnb=cfg.onboarded;
      if(s.exists){const d=s.data();if(d&&d.v===4)cfg=Object.assign(emptyCfg(),d)}else if(!s.metadata.fromCache)cfg=emptyCfg();
      if(first&&(s.exists||!s.metadata.fromCache)){first=false;startFlow();}
      else if(ready&&!locked)render();
      else if(!wasOnb&&cfg.onboarded&&!ready&&!locked&&$("#onbView").hidden===false){}
      setStatus(s.metadata.hasPendingWrites?"Guardando…":s.metadata.fromCache?"Sin conexión: se sincroniza cuando vuelva internet.":store.label);
    },e=>setStatus(e.code==="permission-denied"?"Sin permiso: revisá las reglas de Firestore.":"Se perdió la conexión. Recargá la página.")));
    unsub.push(mCol.orderBy("fecha","desc").limit(5000).onSnapshot(s=>{movs=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ready&&!locked)render()},()=>setStatus("No se pudieron leer los gastos.")));
  });
}
init();
})();
</script>
