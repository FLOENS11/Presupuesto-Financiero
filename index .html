<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sticky month bar on top, one scrolling view, bottom tab bar, floating "+" to add an expense. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#16201B; --muted:#5E6B64; --line:#D9DFDA;
  --accent:#0E6B57; --accent-soft:#DDEEE8; --warn:#9A5B00; --warn-soft:#FBEFD9;
  --bad:#B42318; --bad-soft:#FBE3E0; --good:#1E7A3C;
  --c-fijos:#6B7A73; --c-tar:#C27C0E; --c-deu:#B42318; --c-cuo:#5B5BD6; --c-dia:#0E6B57;
  --f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1412; --surface:#171E1B; --ink:#E6ECE8; --muted:#97A49D; --line:#2A3430;
  --accent:#4FC2A4; --accent-soft:#16332B; --warn:#E3A84A; --warn-soft:#33270F;
  --bad:#F07A6E; --bad-soft:#3A1915; --good:#6FD08D;
  --c-fijos:#8FA199; --c-tar:#E3A84A; --c-deu:#F07A6E; --c-cuo:#9C9CF5; --c-dia:#4FC2A4; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;margin-right:auto}
.mnav{display:flex;align-items:center;gap:2px}
.mnav button{background:none;border:0;cursor:pointer;width:34px;height:34px;border-radius:8px;font-size:18px;color:var(--muted)}
.mnav button:hover{background:var(--line)}
.mnav .lbl{min-width:118px;text-align:center;font-weight:700;text-transform:capitalize;font-size:14px}
.mnav .hoy{font-size:12px;width:auto;padding:0 8px;color:var(--accent);font-weight:700}
.status{max-width:820px;margin:4px auto 0;font-size:11.5px;color:var(--muted);min-height:15px}

main{max-width:820px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.card h2{font-size:15px;font-weight:700;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h2 .num{font-size:14px}
.hint{color:var(--muted);font-size:12.5px;margin-top:2px}
.lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* hero */
.hero .big{font-family:var(--f-num);font-weight:600;font-size:clamp(38px,11vw,58px);line-height:1.05;margin:6px 0 2px;letter-spacing:-.03em}
.hero .big.neg{color:var(--bad)}
.hero .sub{color:var(--muted);font-size:13.5px}
.hero .sub b{color:var(--ink);font-weight:600}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.meter{height:8px;border-radius:99px;background:var(--line);margin-top:14px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend>span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:18px;margin-top:2px}
.kpi .v.neg{color:var(--bad)}

.alerts{display:grid;gap:8px;margin-top:12px}
.alert{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.alert b{color:var(--warn)}
.alert.bad{background:var(--bad-soft)} .alert.bad b{color:var(--bad)}

/* rows */
.rows{margin-top:8px}
.r{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.r:last-child{border-bottom:0}
.r .t{min-width:0}
.r .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .t .s{font-size:12px;color:var(--muted)}
.r.done .t div:first-child{text-decoration:line-through;color:var(--muted)}
.r input[type=checkbox]{width:19px;height:19px;margin:0;accent-color:var(--accent)}
.r.click{cursor:pointer}
.r.click:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.grp{display:flex;justify-content:space-between;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:14px;padding-bottom:4px;border-bottom:1px solid var(--line)}
details.sub>summary{list-style:none;cursor:pointer}
details.sub>summary::-webkit-details-marker{display:none}
details.sub .inner{padding:0 0 6px 29px}
details.sub .inner .r{font-size:13px;padding:7px 0}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.w{background:var(--warn-soft);color:var(--warn)}

/* bars */
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px;margin-top:9px}
.bar .tr{height:10px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar .tr i.over{background:var(--bad)}
.bar .v{font-size:12.5px;text-align:right}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:170px;margin-top:14px;position:relative}
.cols .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0;font-size:11px;color:var(--muted)}
.cols .stack{width:72%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.cols .stack i{display:block;width:100%}
.cols b{font-family:var(--f-num);font-weight:500;font-size:10px;color:var(--ink);white-space:nowrap}
.cols .ingline{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.6}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filters>*{flex:1 1 140px;min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--surface);font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:600}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 11px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--muted);font-size:13.5px;padding:12px 0 4px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;cursor:pointer;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected=true]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 394px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--surface);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 30px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,13,.45)}
.dlg{padding:18px;display:grid;gap:12px;overflow:auto;max-height:calc(100dvh - 30px)}
.dlg h3{margin:0;font-size:17px}
.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt{font-family:var(--f-num);font-size:24px;font-weight:600}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{font-size:13px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.cats button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;font-size:13px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.calc{font-size:13px;color:var(--muted);background:var(--bg);border-radius:9px;padding:9px 11px}
.calc b{color:var(--ink)}

.login{max-width:440px;margin:12vh auto 0;padding:26px 22px;text-align:left}
.login h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
.login p{color:var(--muted);margin:0 0 18px}
.tl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;margin-top:14px}
.tl div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.tl i{display:block;width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.tl div:first-child i{background:var(--muted)}
.tl b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-size:10px;white-space:nowrap}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:420px){.bar{grid-template-columns:78px 1fr auto}.mnav .lbl{min-width:100px}.brand{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

    </div>
  </nav>
</div>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm" autocomplete="off"></form></dialog>

const diffM=(a,b)=>{const[ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number);return (yb-ya)*12+(mb-ma)};
const mName=k=>MNAME[+k.slice(5)-1];

  if(s.includes(",")){s=s.replace(/\./g,"").replace(",",".")}else if((s.match(/\./g)||[]).length>1||/\.\d{3}$/.test(s)){s=s.replace(/\./g,"")}
  const n=parseFloat(s);return isFinite(n)?n:0};

const cardOf=medio=>medio&&medio.startsWith("card:")?cfg.tarjetas.find(t=>"card:"+t.id===medio)||{id:medio.slice(5),nombre:medio.slice(5),cierre:25}:null;
function medioLabel(m){if(!m)return"—";const c=cardOf(m);if(c)return c.nombre;const b=MEDIOS_BASE.find(x=>x[0]===m);if(b)return b[1];

/* ---------- motor de cálculo ---------- */
// monto de un compromiso en el mes k
function itemAmt(it,k){
  const i=diffM(it.desde,k); if(i<0)return 0;
  if(it.hasta&&k>it.hasta)return 0;
  if(it.tipo==="deuda"){const c=+it.monto||0,s=+it.saldo||0;if(!c)return 0;const rem=s-i*c;return Math.max(0,Math.min(c,rem))}
  if(it.n>0&&i>=it.n)return 0;
  return +it.monto||0;
}
// primer mes de pago de un consumo con tarjeta
function primerPago(g){
  const c=cardOf(g.medio); const k=mk(g.fecha);
  if(!c||cfg.cuentaTarjeta==="compra")return k;
  const d=+g.fecha.slice(8,10);
  return addM(k,d>(+c.cierre||25)?2:1);
}
function gastoAmt(g,k){
  const n=Math.max(1,+g.cuotas||1);
  const c=cardOf(g.medio);
  if(!c){return mk(g.fecha)===k?g.monto:0}
  const i=diffM(primerPago(g),k);
  return (i>=0&&i<n)?g.monto/n:0;
}
function calc(k){
  const r={k,ingresos:+cfg.ingreso||0,extra:0,fijos:0,tarjetas:0,cuotas:0,deudas:0,diario:0,porTarjeta:{},lines:[],gastosMes:[],cardGastos:{}};
  cfg.items.forEach(it=>{
    const a=itemAmt(it,k); if(!a&&!(it.falta&&it.desde===k))return;
    if(it.tipo==="ingreso"){r.extra+=a;return}
    const c=cardOf(it.medio);
    if(it.tipo==="cuotas"&&c){r.tarjetas+=a;(r.porTarjeta[c.id]=r.porTarjeta[c.id]||{items:[],gastos:[],total:0});r.porTarjeta[c.id].items.push([it,a]);r.porTarjeta[c.id].total+=a;return}
    if(it.tipo==="fijo")r.fijos+=a;else if(it.tipo==="cuotas")r.cuotas+=a;else if(it.tipo==="deuda")r.deudas+=a;
    r.lines.push([it,a]);
  });
  gastos.forEach(g=>{
    const a=gastoAmt(g,k); if(!a)return;
    const c=cardOf(g.medio);
    if(c&&mk(g.fecha)!==k){ // consumo de meses anteriores que llega en el resumen
      r.tarjetas+=a;(r.porTarjeta[c.id]=r.porTarjeta[c.id]||{items:[],gastos:[],total:0});r.porTarjeta[c.id].gastos.push([g,a]);r.porTarjeta[c.id].total+=a;
    }else{r.diario+=a;r.gastosMes.push([g,a])}
  });
  // gastos con tarjeta hechos este mes que se pagan más adelante (solo informativo)
  r.diferidos=gastos.filter(g=>cardOf(g.medio)&&mk(g.fecha)===k&&cfg.cuentaTarjeta!=="compra").reduce((s,g)=>s+g.monto,0);
  r.ingresos+=r.extra;
  r.comp=r.fijos+r.tarjetas+r.cuotas+r.deudas;
  r.disp=r.ingresos-r.comp;
  r.queda=r.disp-r.diario;
  return r;
}
function isPaid(key){return !!cfg.pagados[key]}
// cuánto se debe hoy (todo lo agendado no marcado como pagado)
function deudaResumen(){
  const start="2026-01",end=addM(mk(todayISO()),48);
  const out={tarjetas:{},otros:[]};
  for(let k=start;k<=end;k=addM(k,1)){
    const r=calc(k);
    Object.entries(r.porTarjeta).forEach(([id,t])=>{if(!isPaid(k+"|card:"+id)){(out.tarjetas[id]=out.tarjetas[id]||{total:0,next:null});out.tarjetas[id].total+=t.total;if(!out.tarjetas[id].next&&t.total>0)out.tarjetas[id].next=[k,t.total]}});
  }
  cfg.items.filter(it=>it.tipo==="deuda"||(it.tipo==="cuotas"&&!cardOf(it.medio))).forEach(it=>{
    let total=it.tipo==="deuda"?(+it.saldo||0):0,pag=0,next=null;
    const meses=it.tipo==="deuda"?(+it.monto?Math.ceil((+it.saldo||0)/it.monto):0):(it.n||1);
    for(let i=0;i<Math.min(meses,600);i++){const k=addM(it.desde,i),a=itemAmt(it,k);if(!a)continue;
      if(it.tipo!=="deuda")total+=a;if(isPaid(k+"|"+it.id))pag+=a;else if(!next)next=[k,a]}
    out.otros.push({it,total,pag,rest:Math.max(0,total-pag),next,sinPlan:it.tipo==="deuda"&&!(+it.monto)&&total>0});
  });
  out.totTar=Object.values(out.tarjetas).reduce((s,t)=>s+t.total,0);
  out.totOtros=out.otros.reduce((s,o)=>s+o.rest,0);
  out.total=out.totTar+out.totOtros;
  return out;
}

  h+=`</div></div>`;
  $("#v-movs").innerHTML=h;
}

/* ---------- render: compromisos ---------- */
function itemDesc(it){
  const m=medioLabel(it.medio);
  if(it.tipo==="fijo")return `${fmt(it.monto)} por mes · desde ${mShort(it.desde)} ${it.desde.slice(0,4)}${it.hasta?" hasta "+mShort(it.hasta)+" "+it.hasta.slice(0,4):""} · ${m}`;
  if(it.tipo==="cuotas")return `${it.n>0?it.n+" cuota"+(it.n>1?"s":"")+" de ":""}${fmt(it.monto)} · desde ${mShort(it.desde)} ${it.desde.slice(0,4)} · ${m}${it.tna?" · TNA "+String(it.tna).replace(".",",")+"%":""}`;
  if(it.tipo==="deuda")return `Saldo ${fmt(it.saldo)} · ${+it.monto?"cuota "+fmt(it.monto)+" desde "+mShort(it.desde)+" "+it.desde.slice(0,4):"sin cuota cargada"}`;
  if(it.tipo==="ingreso")return `${fmt(it.monto)} · ${it.n===1?"una vez en":"desde"} ${mShort(it.desde)} ${it.desde.slice(0,4)}`;
}
function renderComp(){
  let h=`<div class="card"><h2>Compromisos</h2><div class="hint">Todo lo que se repite o se paga en cuotas: gastos fijos, compras en cuotas, préstamos, deudas e ingresos extra. Tocá uno para editarlo.</div>
  <div class="btnrow"><button class="btn" data-new="fijo">+ Gasto fijo</button><button class="btn sec" data-new="cuotas">+ Compra en cuotas</button><button class="btn sec" data-new="deuda">+ Préstamo o deuda</button><button class="btn sec" data-new="ingreso">+ Ingreso</button></div></div>`;
  const groups=[["fijo","Gastos fijos mensuales"],["cuotas","Compras en cuotas"],["deuda","Préstamos y deudas"],["ingreso","Ingresos extra"]];
  groups.forEach(([t,lab])=>{
    let its=cfg.items.filter(it=>it.tipo===t);if(!its.length)return;
    if(t==="cuotas"){
      const byCard={};its.forEach(it=>{const c=cardOf(it.medio);const key=c?c.nombre:"Sin tarjeta";(byCard[key]=byCard[key]||[]).push(it)});
      h+=`<div class="card"><h2>${lab}</h2>`;
      Object.entries(byCard).forEach(([cn,arr])=>{
        const rest=arr.reduce((s,it)=>{let x=0;for(let i=0;i<(it.n||1);i++){const k=addM(it.desde,i);if(k>=mk(todayISO())||!isPaid(k+"|card:"+(cardOf(it.medio)||{}).id))x+=+it.monto||0}return s+x},0);
        h+=`<div class="grp"><span>${esc(cn)}</span><span class="num">${fmt(rest)}</span></div>`+arr.map(it=>rowItem(it)).join("");
      });
      h+=`</div>`;return;
    }
    const tot=t==="fijo"?its.reduce((s,it)=>s+(+it.monto||0),0):null;
    h+=`<div class="card"><h2>${lab}${tot!=null?`<span class="num">${fmt(tot)}/mes</span>`:""}</h2>${its.map(it=>rowItem(it)).join("")}</div>`;
  });
  $("#v-comp").innerHTML=h;
}
function rowItem(it){return `<div class="r click" data-edit-item="${esc(it.id)}"><span class="dot" style="--c:var(${it.tipo==="fijo"?"--c-fijos":it.tipo==="deuda"?"--c-deu":it.tipo==="ingreso"?"--good":cardOf(it.medio)?"--c-tar":"--c-cuo"})"></span><div class="t"><div>${esc(it.nombre)}${it.falta&&!(+it.monto)?'<span class="tag w">falta</span>':""}</div><div class="s">${esc(itemDesc(it))}</div></div><span class="num">${fmt(it.tipo==="deuda"?it.saldo:it.monto)}</span></div>`}

/* ---------- render: deudas ---------- */
function renderDeudas(){
  const d=deudaResumen();
  let h=`<div class="card hero"><div class="lab">Lo que debés hoy</div><div class="big">${fmt(d.total)}</div><div class="sub">Tarjetas <b class="num">${fmt(d.totTar)}</b> (con interés) · préstamos y deudas <b class="num">${fmt(d.totOtros)}</b>. Baja cuando marcás pagos como hechos.</div></div>`;
  h+=`<div class="card"><h2>Tarjetas</h2>`;
  Object.entries(d.tarjetas).filter(([,t])=>t.total>0).forEach(([id,t])=>{const c=cfg.tarjetas.find(x=>x.id===id)||{nombre:id};
    h+=`<div class="r"><span class="dot" style="--c:var(--c-tar)"></span><div class="t"><div>${esc(c.nombre)}</div><div class="s">${t.next?"próximo resumen: "+fmt(t.next[1])+" en "+mName(t.next[0]):"sin pagos pendientes"}</div></div><span class="num">${fmt(t.total)}</span></div>`});
  if(!d.totTar)h+=`<div class="empty">No hay cuotas pendientes en tarjetas.</div>`;
  h+=`</div><div class="card"><h2>Préstamos y deudas</h2>`;
  d.otros.forEach(o=>{const pct=o.total?Math.min(100,o.pag/o.total*100):0;
    h+=`<div class="r click" data-edit-item="${esc(o.it.id)}" style="grid-template-columns:auto 1fr auto"><span class="dot" style="--c:var(--c-deu)"></span><div class="t"><div>${esc(o.it.nombre)}${o.sinPlan?'<span class="tag w">sin cuota</span>':""}</div><div class="s">${o.total?"pagado "+fmt(o.pag)+" de "+fmt(o.total):"sin saldo cargado"}${o.next?" · próximo: "+fmt(o.next[1])+" en "+mName(o.next[0]):""}</div><div class="prog"><i style="width:${pct}%"></i></div></div><span class="num">${fmt(o.rest)}</span></div>`});
  h+=`</div>`;
  // evolución
  const base=mk(todayISO());let run=d.total;const pts=[["hoy",run]];
  for(let i=0;i<6;i++){const k=addM(base,i),r=calc(k);
    const unpaidTar=Object.entries(r.porTarjeta).filter(([id])=>!isPaid(k+"|card:"+id)).reduce((s,[,t])=>s+t.total,0);
    const unpaidOtros=r.lines.filter(([it])=>(it.tipo==="deuda"||(it.tipo==="cuotas"&&!cardOf(it.medio)))&&!isPaid(k+"|"+it.id)).reduce((s,[,a])=>s+a,0);
    run=Math.max(0,run-unpaidTar-unpaidOtros);pts.push(["fin "+mShort(k),run])}
  const mx=Math.max(1,...pts.map(p=>p[1]));
  h+=`<div class="card"><h2>Cómo baja si seguís el plan</h2><div class="hint">Lo que queda al final es deuda sin cuotas asignadas.</div><div class="tl">${pts.map(p=>`<div><b>${fmtM(p[1])}</b><i style="height:${p[1]/mx*100}%"></i><span>${p[0]}</span></div>`).join("")}</div></div>`;
  $("#v-deudas").innerHTML=h;
}

/* ---------- render: ajustes ---------- */

  let h=`<div class="card"><h2>Ingreso mensual</h2><div class="two" style="margin-top:10px"><label class="f">Sueldo neto<input id="a_ing" class="num" inputmode="decimal" value="${amtStr(cfg.ingreso)}"></label><label class="f">Día de cobro<input id="a_dia" class="num" inputmode="numeric" value="${cfg.diaCobro||1}"></label></div><div class="hint" style="margin-top:6px">Para un ingreso extra (aguinaldo, un trabajo) usá Compromisos → + Ingreso.</div></div>`;
  h+=`<div class="card"><h2>Tarjetas de crédito</h2><div class="hint">El día de cierre define en qué resumen cae cada compra: si comprás después del cierre, se paga un mes más tarde.</div><div class="rows">`;
  cfg.tarjetas.forEach((t,i)=>h+=`<div class="two" style="grid-template-columns:1fr 110px auto;align-items:end;margin-top:8px"><label class="f">Nombre<input data-tj="${i}" data-f="nombre" value="${esc(t.nombre)}"></label><label class="f">Día de cierre<input data-tj="${i}" data-f="cierre" class="num" inputmode="numeric" value="${t.cierre}"></label><button class="btn danger sm" data-deltj="${i}" type="button">${ui.armed==="tj"+i?"¿Seguro?":"Quitar"}</button></div>`);
  h+=`</div><div class="btnrow"><button class="btn sec sm" id="addTj" type="button">+ Agregar tarjeta</button></div></div>`;
  h+=`<div class="card"><h2>Gastos con tarjeta</h2><div class="hint">¿Cuándo descontar del presupuesto lo que comprás con tarjeta de crédito?</div><div class="seg" style="margin-top:10px">
    <button type="button" data-ct="resumen" aria-pressed="${cfg.cuentaTarjeta!=="compra"}">Cuando pago el resumen</button><button type="button" data-ct="compra" aria-pressed="${cfg.cuentaTarjeta==="compra"}">El día que compro</button></div>
    <div class="hint" style="margin-top:8px">${cfg.cuentaTarjeta==="compra"?"La compra resta del mes en que la hacés (las cuotas, una por mes desde ese mes).":"La compra resta del mes en que pagás el resumen, según el día de cierre. Las cuotas se reparten en los meses siguientes."}</div></div>`;
  h+=`<div class="card"><h2>Categorías y topes</h2><div class="hint">Poné un tope mensual para controlar cuánto gastás en cada categoría (opcional).</div><div class="rows">`;
  cfg.categorias.forEach((c,i)=>h+=`<div class="two" style="grid-template-columns:1fr 140px auto;align-items:end;margin-top:8px"><label class="f">Categoría<input data-cat-i="${i}" value="${esc(c)}"></label><label class="f">Tope por mes<input data-tope="${esc(c)}" class="num" inputmode="decimal" placeholder="sin tope" value="${amtStr(+(cfg.topes||{})[c]||0)}"></label><button class="btn danger sm" data-delcat="${i}" type="button">${ui.armed==="cat"+i?"¿Seguro?":"Quitar"}</button></div>`);
  h+=`</div><div class="btnrow"><button class="btn sec sm" id="addCat" type="button">+ Agregar categoría</button></div></div>`;
  h+=`<div class="card"><h2>Tus datos</h2><div class="hint">Descargá tus gastos en un archivo que abre Excel.</div><div class="btnrow"><button class="btn sec" id="expCsv" type="button">Descargar gastos (CSV)</button><button class="btn sec" id="expPlan" type="button">Descargar plan mes a mes (CSV)</button></div></div>`;
  h+=`<div class="card"><h2>Cuenta</h2><div class="hint" id="who"></div><div class="btnrow"><button class="btn sec" id="logoutBtn" type="button">Salir</button><button class="btn danger" id="resetBtn" type="button">${ui.armed==="reset"?"Tocá de nuevo para confirmar":"Volver al plan original"}</button></div><div class="hint" style="margin-top:8px">"Volver al plan original" restaura tarjetas, deudas y fijos como los armamos. No borra tus gastos ni los pagos marcados.</div></div>`;
  $("#v-ajustes").innerHTML=h;
  if(store&&store.email)$("#who").textContent="Entraste como "+store.email;
}

/* ---------- render general ---------- */
function renderTop(){$("#mLbl").textContent=mLabel(mes);$("#mHoy").hidden=mes===mk(todayISO())}
function render(){
  renderTop();
  const editing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#v-ajustes,#v-movs .filters");
  if(view==="inicio")renderInicio();
  if(view==="movs"&&!editing)renderMovs();
  if(view==="comp")renderComp();
  if(view==="deudas")renderDeudas();
  if(view==="ajustes"&&!editing)renderAjustes();
}
function go(v){view=v;document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));["inicio","movs","comp","deudas","ajustes"].forEach(x=>$("#v-"+x).hidden=x!==v);$("#fab").hidden=v==="ajustes";render();window.scrollTo({top:0})}

/* ---------- diálogo: gasto ---------- */
const dlg=$("#dlg"),form=$("#dlgForm");
let dctx=null;
function openGasto(g){
  const isNew=!g;
  g=g?clone(g):{fecha:(mes===mk(todayISO())?todayISO():mes+"-01"),monto:0,cat:cfg.categorias[0],medio:"debito",cuotas:1,nota:""};
  dctx={type:"g",g,isNew,cat:g.cat};
  form.innerHTML=`<h3>${isNew?"Anotar gasto":"Editar gasto"}</h3>
  <label class="f">Monto total ($)<input id="g_monto" class="amt" inputmode="decimal" placeholder="0" value="${amtStr(g.monto)}" required></label>
  <div class="cats" id="g_cats">${cfg.categorias.map(c=>`<button type="button" data-gcat="${esc(c)}" aria-pressed="${c===g.cat}">${esc(c)}</button>`).join("")}</div>
  <div class="two"><label class="f">Cómo pagaste<select id="g_medio">${mediosOpts(g.medio)}</select></label><label class="f">Fecha<input type="date" id="g_fecha" value="${esc(g.fecha)}"></label></div>
  <div id="g_cuotasBox" class="two"><label class="f">Cuotas<select id="g_cuotas">${[1,2,3,4,5,6,9,10,12,18,24].map(n=>`<option value="${n}" ${n==(+g.cuotas||1)?"selected":""}>${n===1?"1 pago":n+" cuotas"}</option>`).join("")}</select></label><div class="calc" id="g_calc"></div></div>
  <label class="f">Detalle<input id="g_nota" value="${esc(g.nota||"")}" placeholder="Ej: súper, zapatillas, Uber"></label>
  <div class="btnrow" style="justify-content:space-between"><div>${isNew?"":`<button type="button" class="btn danger" id="g_del">Borrar</button>`}</div><div style="display:flex;gap:8px"><button type="button" class="btn sec" id="d_cancel">Cancelar</button><button type="submit" class="btn" id="g_save">Guardar</button></div></div>`;
  updGastoCalc();dlg.showModal();setTimeout(()=>$("#g_monto").focus(),50);
}
function updGastoCalc(){
  const c=cardOf($("#g_medio").value),box=$("#g_cuotasBox");box.hidden=!c;
  if(!c){return}
  const n=+$("#g_cuotas").value||1,m=parseAmt($("#g_monto").value),f=$("#g_fecha").value||todayISO();
  const first=primerPago({fecha:f,medio:$("#g_medio").value});
  $("#g_calc").innerHTML=`${n>1?`<b class="num">${n} × ${fmt(m/n)}</b><br>`:""}${cfg.cuentaTarjeta==="compra"?"Se descuenta desde "+mName(first):"Primer pago en el resumen de <b>"+mName(first)+"</b>"}`;
}
/* ---------- diálogo: compromiso ---------- */
function openItem(it,tipo){
  const isNew=!it;
  it=it?clone(it):{id:uid_(),tipo,nombre:"",monto:0,n:tipo==="cuotas"?3:tipo==="ingreso"?1:0,desde:addM(mk(todayISO()),tipo==="cuotas"?1:0),medio:tipo==="cuotas"?"card:"+(cfg.tarjetas[0]||{id:""}).id:"transferencia",cat:tipo==="fijo"?"Servicios":"",saldo:0};
  dctx={type:"it",it,isNew};
  const t=it.tipo;
  let h=`<h3>${isNew?"Nuevo":"Editar"}: ${TIPOS[t].toLowerCase()}</h3>
  <label class="f">Nombre<input id="i_nombre" value="${esc(it.nombre)}" required placeholder="${t==="fijo"?"Ej: Internet":t==="cuotas"?"Ej: Heladera":t==="deuda"?"Ej: Préstamo del banco":"Ej: Aguinaldo"}"></label>`;
  if(t==="deuda")h+=`<div class="two"><label class="f">Saldo total que debés<input id="i_saldo" class="num" inputmode="decimal" value="${amtStr(it.saldo)}"></label><label class="f">Cuota mensual<input id="i_monto" class="num" inputmode="decimal" value="${amtStr(it.monto)}"></label></div>`;
  else h+=`<div class="two"><label class="f">${t==="fijo"?"Monto por mes":t==="cuotas"?"Monto de cada cuota":"Monto"}<input id="i_monto" class="num" inputmode="decimal" value="${amtStr(it.monto)}"></label>${t==="cuotas"?`<label class="f">Cuotas que quedan<input id="i_n" class="num" inputmode="numeric" value="${it.n||1}"></label>`:t==="ingreso"?`<label class="f">Se repite<select id="i_n"><option value="1" ${it.n===1?"selected":""}>Una sola vez</option><option value="0" ${it.n!==1?"selected":""}>Todos los meses</option></select></label>`:`<label class="f">Categoría<select id="i_cat">${["Vivienda","Servicios","Salud","Belleza","Educación","Transporte","Suscripciones",...cfg.categorias].filter((v,i,a)=>a.indexOf(v)===i).map(c=>`<option ${c===it.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></label>`}</div>`;
  h+=`<div class="two"><label class="f">${t==="cuotas"?"Primera cuota que pagás en":t==="deuda"?"Primera cuota en":t==="ingreso"?"Mes":"Desde"}<select id="i_desde">${monthOpts(it.desde)}</select></label>`;
  if(t==="fijo")h+=`<label class="f">Hasta (opcional)<select id="i_hasta"><option value="">Sin fecha de fin</option>${monthOpts(it.hasta)}</select></label>`;
  else if(t!=="ingreso")h+=`<label class="f">Cómo se paga<select id="i_medio">${mediosOpts(it.medio,t!=="deuda"||true)}</select></label>`;
  h+=`</div>`;
  if(t==="fijo")h+=`<label class="f">Cómo se paga<select id="i_medio">${mediosOpts(it.medio)}</select></label>`;
  if(t==="cuotas")h+=`<label class="f">TNA % (opcional, para Plan V o compras con interés)<input id="i_tna" class="num" inputmode="decimal" value="${it.tna?String(it.tna).replace(".",","):""}"></label>`;
  h+=`<div class="calc" id="i_calc"></div>
  <div class="btnrow" style="justify-content:space-between"><div>${isNew?"":`<button type="button" class="btn danger" id="i_del">Borrar</button>`}</div><div style="display:flex;gap:8px"><button type="button" class="btn sec" id="d_cancel">Cancelar</button><button type="submit" class="btn">Guardar</button></div></div>`;
  form.innerHTML=h;updItemCalc();dlg.showModal();setTimeout(()=>$("#i_nombre").focus(),50);
}
function readItem(){
  const it=dctx.it,t=it.tipo;
  it.nombre=$("#i_nombre").value.trim()||TIPOS[t];
  it.monto=parseAmt($("#i_monto").value);
  it.desde=$("#i_desde").value;
  if(t==="deuda")it.saldo=parseAmt($("#i_saldo").value);
  if(t==="cuotas")it.n=Math.max(1,parseInt($("#i_n").value)||1);
  if(t==="ingreso")it.n=+$("#i_n").value;
  if(t==="fijo"){it.cat=$("#i_cat").value;it.hasta=$("#i_hasta").value||null;if(!it.hasta)delete it.hasta}
  if($("#i_medio"))it.medio=$("#i_medio").value;
  if(t==="cuotas"){const v=parseAmt($("#i_tna").value);if(v)it.tna=v;else delete it.tna}
  if(t==="ingreso"){it.medio="";it.cat="Ingreso"}
  it.falta=(t==="deuda"?!(+it.monto)&&!!(+it.saldo):!(+it.monto))&&!!it.falta;
  return it;
}
function updItemCalc(){
  if(!dctx||dctx.type!=="it")return;const it=readItem(),el=$("#i_calc");
  if(it.tipo==="cuotas"){const fin=addM(it.desde,it.n-1);el.innerHTML=`Total: <b class="num">${fmt(it.monto*it.n)}</b> · termina en ${mLabel(fin)}`}
  else if(it.tipo==="deuda"){if(+it.monto&&+it.saldo){const n=Math.ceil(it.saldo/it.monto);el.innerHTML=`${n} cuota${n>1?"s":""} · terminás de pagar en <b>${mLabel(addM(it.desde,n-1))}</b>`}else el.textContent="Cargá el saldo y la cuota para ver cuándo terminás."}
  else if(it.tipo==="fijo")el.innerHTML=`Por año: <b class="num">${fmt(it.monto*12)}</b>`;
  else el.innerHTML=it.n===1?`Suma ${fmt(it.monto)} a ${mLabel(it.desde)}`:`Suma ${fmt(it.monto)} todos los meses desde ${mLabel(it.desde)}`;
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const tab=t.closest("nav.tabs [data-v]");if(tab){go(tab.dataset.v);return}
  if(t.closest("#mPrev")){mes=addM(mes,-1);render();return}
  if(t.closest("#mNext")){mes=addM(mes,1);render();return}
  if(t.closest("#mHoy")){mes=mk(todayISO());render();return}
  if(t.closest("#fab")){openGasto(null);return}
  const eg=t.closest("[data-edit-g]");if(eg&&!t.closest("input")){const g=gastos.find(x=>x.id===eg.dataset.editG);if(g)openGasto(g);return}
  const ei=t.closest("[data-edit-item]");if(ei&&!t.closest("input[type=checkbox]")){e.preventDefault();const it=cfg.items.find(x=>x.id===ei.dataset.editItem);if(it)openItem(it);return}
  const nw=t.closest("[data-new]");if(nw){openItem(null,nw.dataset.new);return}
  const gc=t.closest("[data-gcat]");if(gc){dctx.cat=gc.dataset.gcat;document.querySelectorAll("[data-gcat]").forEach(b=>b.setAttribute("aria-pressed",b===gc));return}
  if(t.id==="d_cancel"){dlg.close();return}
  if(t.id==="g_del"){if(t.dataset.armed){dlg.close();store.delGasto(dctx.g.id).then(()=>toast("Gasto borrado"))}else{t.dataset.armed=1;t.textContent="¿Borrar de verdad?"}return}
  if(t.id==="i_del"){if(t.dataset.armed){dlg.close();cfg.items=cfg.items.filter(x=>x.id!==dctx.it.id);saveCfg();render();toast("Compromiso borrado")}else{t.dataset.armed=1;t.textContent="¿Borrar de verdad?"}return}
  const ct=t.closest("[data-ct]");if(ct){cfg.cuentaTarjeta=ct.dataset.ct;saveCfg();renderAjustes();return}
  if(t.id==="addTj"){cfg.tarjetas.push({id:uid_(),nombre:"Nueva tarjeta",cierre:25});saveCfg();renderAjustes();return}
  if(t.id==="addCat"){cfg.categorias.push("Nueva categoría");saveCfg();renderAjustes();return}
  const dt=t.closest("[data-deltj]");if(dt){const i=+dt.dataset.deltj;if(ui.armed==="tj"+i){ui.armed=null;cfg.tarjetas.splice(i,1);saveCfg()}else{ui.armed="tj"+i;setTimeout(()=>{if(ui.armed==="tj"+i){ui.armed=null;renderAjustes()}},4000)}renderAjustes();return}
  const dc=t.closest("[data-delcat]");if(dc){const i=+dc.dataset.delcat;if(ui.armed==="cat"+i){ui.armed=null;const c=cfg.categorias.splice(i,1)[0];if(cfg.topes)delete cfg.topes[c];saveCfg()}else{ui.armed="cat"+i;setTimeout(()=>{if(ui.armed==="cat"+i){ui.armed=null;renderAjustes()}},4000)}renderAjustes();return}
  if(t.id==="resetBtn"){if(ui.armed==="reset"){ui.armed=null;const p=cfg.pagados;cfg=basePlan();cfg.pagados=p;saveCfg();toast("Plan restaurado");render()}else{ui.armed="reset";setTimeout(()=>{if(ui.armed==="reset"){ui.armed=null;renderAjustes()}},4000);renderAjustes()}return}
  if(t.id==="logoutBtn"){store&&store.logout&&store.logout();return}
  if(t.id==="expCsv"){exportGastos();return}
  if(t.id==="expPlan"){exportPlan();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.pago){if(t.checked)cfg.pagados[t.dataset.pago]=true;else delete cfg.pagados[t.dataset.pago];saveCfg();render();return}
  if(t.id==="fcat"){ui.fcat=t.value;renderMovs();return}
  if(t.id==="fmedio"){ui.fmedio=t.value;renderMovs();return}
  if(t.id==="a_ing"){cfg.ingreso=parseAmt(t.value);saveCfg();return}
  if(t.id==="a_dia"){cfg.diaCobro=Math.min(31,Math.max(1,parseInt(t.value)||1));saveCfg();return}
  if(t.dataset.tj!=null){const tj=cfg.tarjetas[+t.dataset.tj];if(t.dataset.f==="cierre")tj.cierre=Math.min(31,Math.max(1,parseInt(t.value)||25));else tj.nombre=t.value.trim()||tj.nombre;saveCfg();return}
  if(t.dataset.catI!=null){const i=+t.dataset.catI,old=cfg.categorias[i],nv=t.value.trim();if(nv&&nv!==old){cfg.categorias[i]=nv;if(cfg.topes&&old in cfg.topes){cfg.topes[nv]=cfg.topes[old];delete cfg.topes[old]}saveCfg()}return}
  if(t.dataset.tope!=null){cfg.topes=cfg.topes||{};const v=parseAmt(t.value);if(v)cfg.topes[t.dataset.tope]=v;else delete cfg.topes[t.dataset.tope];saveCfg();return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;const pos=t.selectionStart;renderMovs();const q=$("#q");q.focus();q.setSelectionRange(pos,pos);return}
  if(["g_monto","g_medio","g_cuotas","g_fecha"].includes(t.id)){t.setCustomValidity("");updGastoCalc();return}
  if(t.id&&t.id.startsWith("i_"))updItemCalc();
});
form.addEventListener("change",e=>{if(["g_medio","g_cuotas","g_fecha"].includes(e.target.id))updGastoCalc();else if(e.target.id.startsWith("i_"))updItemCalc()});
form.addEventListener("submit",async e=>{
  e.preventDefault();
  if(dctx.type==="g"){
    const m=$("#g_monto"),monto=parseAmt(m.value);
    if(!(monto>0)){m.setCustomValidity("Escribí un monto mayor a cero");m.reportValidity();return}
    const medio=$("#g_medio").value,g=Object.assign(dctx.g,{monto,cat:dctx.cat,medio,fecha:$("#g_fecha").value||todayISO(),cuotas:cardOf(medio)?(+$("#g_cuotas").value||1):1,nota:$("#g_nota").value.trim().slice(0,140)});
    if(dctx.isNew)g.creado=Date.now();
    dlg.close();
    try{await store.saveGasto(g);toast(dctx.isNew?"Gasto anotado":"Gasto actualizado")}catch(err){toast("No se pudo guardar. Probá de nuevo.")}
  }else{
    const it=readItem();
    if(dctx.isNew)cfg.items.push(it);else cfg.items[cfg.items.findIndex(x=>x.id===it.id)]=it;
    dlg.close();saveCfg();render();toast("Guardado");
  }
});

/* ---------- exportar ---------- */
function download(name,text){const b=new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvCell=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const n2=v=>(Math.round(v*100)/100).toString().replace(".",",");
function exportGastos(){
  const rows=[["Fecha","Categoría","Detalle","Medio","Cuotas","Monto"]].concat(gastos.slice().sort((a,b)=>a.fecha<b.fecha?-1:1).map(g=>[g.fecha.split("-").reverse().join("/"),g.cat,g.nota||"",medioLabel(g.medio),g.cuotas||1,n2(g.monto)]));
  download("gastos.csv",rows.map(r=>r.map(csvCell).join(";")).join("\n"));
}
function exportPlan(){
  const base=mk(todayISO()),ms=[...Array(12)].map((_,i)=>addM(base,i)),rs=ms.map(calc);
  const L=[["Concepto",...ms.map(mLabel)],["Ingresos",...rs.map(r=>n2(r.ingresos))],["Gastos fijos",...rs.map(r=>n2(r.fijos))],["Tarjetas",...rs.map(r=>n2(r.tarjetas))],["Cuotas sin tarjeta",...rs.map(r=>n2(r.cuotas))],["Deudas",...rs.map(r=>n2(r.deudas))],["Para el día a día",...rs.map(r=>n2(r.disp))],["Gastado",...rs.map(r=>n2(r.diario))],["Queda",...rs.map(r=>n2(r.queda))]];
  download("plan-mes-a-mes.csv",L.map(r=>r.map(csvCell).join(";")).join("\n"));
}

/* ---------- migración de versiones anteriores ---------- */
function migrate(d){
  if(!d)return null;
  if(d.v===3)return Object.assign(basePlan(),clone(d));
  const n=basePlan();
  if(d.v===1||d.v===2){
    n.ingreso=+d.ingreso||n.ingreso;
    const pm={mc9317:"card:mc",mc8210:"card:mc",v7731:"card:visa",v0327:"card:visa",t9317:"card:mc",t8210:"card:mc",t2:"card:visa"};
    Object.keys(d.pagados||{}).forEach(k=>{const[m,id]=k.split("|");n.pagados[m+"|"+(pm[id]||id)]=true});
    const tgi=(d.fijos||[]).find(f=>f.id==="tgi");if(tgi&&+tgi.monto){const it=n.items.find(x=>x.id==="tgi");it.monto=+tgi.monto;it.falta=false}
    const rs=(d.tarjetas||[]).find(t=>t.id==="ressep");if(rs&&+((rs.plan||{})["2026-10"])){const it=n.items.find(x=>x.id==="ressep");it.monto=+rs.plan["2026-10"];it.falta=false}
    ["anses","tgideuda","naranja","mp","expdeuda"].forEach(id=>{const o=(d.deudas||[]).find(x=>x.id===id),it=n.items.find(x=>x.id===id);if(!o||!it)return;
      it.saldo=+o.saldo||0;const ks=Object.keys(o.plan||{}).filter(k=>+o.plan[k]).sort();if(ks.length){it.desde=ks[0];it.monto=+o.plan[ks[0]];it.falta=false}});
    return n;
  }
  return null;
}
function normGasto(g){ // gastos de versiones anteriores
  if(g.medio==="Tarjeta de crédito")g.medio="card:"+(cfg.tarjetas[0]||{id:"visa"}).id;
  else if(g.medio==="Débito / transferencia")g.medio="debito";
  else if(g.medio==="Efectivo")g.medio="efectivo";
  else if(g.medio==="Mercado Pago")g.medio="mp";
  g.monto=+g.monto||0;return g;
}

/* ---------- guardado ---------- */
let saveT=null,chain=Promise.resolve();
function saveCfg(){clearTimeout(saveT);setStatus("Guardando…");saveT=setTimeout(()=>{const body=clone(cfg);chain=chain.then(()=>store.saveCfg(body)).then(()=>setStatus(store.label)).catch(()=>setStatus("No se pudo guardar. Revisá la conexión."))},500)}
function setStatus(t){$("#status").textContent=t||""}
function localStore(){
  const K="presupuesto_v1";let data={cfg:null,gastos:[]};
  try{data=JSON.parse(localStorage.getItem(K))||data}catch(e){}
  const m=migrate(data.cfg);if(m)cfg=m;gastos=(data.gastos||[]).map(normGasto);
  const w=()=>{try{localStorage.setItem(K,JSON.stringify({cfg,gastos}))}catch(e){}};
  return{label:"Guardado en este navegador.",saveCfg:async()=>w(),
    saveGasto:async g=>{if(!g.id){g.id="g"+Date.now().toString(36)+uid_();gastos.push(g)}else{const i=gastos.findIndex(x=>x.id===g.id);if(i>=0)gastos[i]=g;else gastos.push(g)}w();render()},
    delGasto:async id=>{gastos=gastos.filter(g=>g.id!==id);w();render()}};
}
function init(){
  mes=mk(todayISO());
  if(!window.firebase||!FIREBASE_CONFIG.apiKey){store=localStore();setStatus("Sin conexión a Firebase: se guarda solo en este navegador.");render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),fdb=firebase.firestore();
  fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  $("#loginBtn").onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}catch(e){if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"||e.code==="auth/cancelled-popup-request"))auth.signInWithRedirect(p);else if(e.code!=="auth/popup-closed-by-user")$("#loginMsg").textContent="No se pudo entrar: "+(e.code==="auth/unauthorized-domain"?"falta autorizar este dominio en Firebase.":"probá de nuevo.")}};
  let unsub=[];
  auth.onAuthStateChanged(user=>{
    unsub.forEach(u=>u());unsub=[];
    $("#loginView").hidden=!!user;$("#appView").hidden=!user;
    if(!user)return;
    setStatus("Conectando…");
    const base=fdb.collection("users").doc(user.uid),cfgRef=base.collection("config").doc("main"),gCol=base.collection("gastos");
    store={label:"Guardado en tu cuenta.",email:user.email,logout:()=>auth.signOut(),
      saveCfg:body=>cfgRef.set(body),
      saveGasto:async g=>{const{id,...data}=g;if(id)await gCol.doc(id).set(data);else await gCol.add(data)},
      delGasto:async id=>{await gCol.doc(id).delete()}};
    let first=true;
    unsub.push(cfgRef.onSnapshot(s=>{
      if(s.exists){const d=s.data(),m=migrate(d);if(m){cfg=m;if(d.v!==3&&first)saveCfg()}}
      else if(first&&!s.metadata.fromCache)saveCfg();
      first=false;gastos=gastos.map(normGasto);render();
      setStatus(s.metadata.hasPendingWrites?"Guardando…":s.metadata.fromCache?"Sin conexión: se sincroniza cuando vuelva internet.":store.label);
    },e=>setStatus(e.code==="permission-denied"?"Firebase rechazó el acceso: revisá las reglas.":"Se perdió la conexión. Recargá la página.")));
    unsub.push(gCol.orderBy("fecha","desc").limit(3000).onSnapshot(s=>{gastos=s.docs.map(d=>normGasto(Object.assign({id:d.id},d.data())));render()},()=>setStatus("No se pudieron leer los gastos.")));
  });
}
init();
})();
</script>
